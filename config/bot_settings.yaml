global:
  ai:
    models:
      default: gemini-2.5-flash
      chat: gemini-2.5-flash
      summary: gemini-2.5-flash
      embedding: embeddinggemma
      fallback:
      - qwen3.5:122b
    timeout_sec: 180
  chat:
    history_lines: 100
    user_history_lines: 24
    channel_history_lines: 16
    semantic_history_k: 6
    history_max_messages: 1000
    history_retention_days: 30
    max_response_length: 1800
    max_response_length_prompt: 1800
    free_talk_channel_ids: []
  summarize_recent_default_messages: 30
  summarize_recent:
    history_fetch_limit: 300
    transcript_lines_limit: 120
    max_messages: 300
  kenny_chat:
    cooldown_seconds: 12
    block_invite_and_mass_mention: true
    delete_mirrors_on_source_delete: false
  weekly_ai_posts:
    enabled: true
    poll_seconds: 60
    items:
    - id: daily_world_trivia
      enabled: true
      channel_id: 1518267649786908743
      weekday: 毎日
      time: '12:00'
      timezone: Asia/Tokyo
      model: gemini-2.5-flash
      today_language:
        enabled: true
        reactions:
          enabled: true
          unknown_emoji: ✋
          known_emoji: 👀
          learned_emoji: ✅
          issue_emoji: ⚠️
      prompt: 'Discordの管理チャンネルに投稿する短い海外の豆知識を1つ作ってください。

        条件:

        - 日本語で2〜4文

        - 毎回ランダムに世界のエリアを1つ選ぶ

        - エリア例: アジア、ヨーロッパ、北米、南米、アフリカ、中東、オセアニア、北欧、東南アジア、中央アジア

        - 選んだエリアの文化、地理、歴史、生活習慣のどれかに関する意外な豆知識

        - 最初に「【海外豆知識】~○○編~」と付ける

        - 誤情報を避け、断定しすぎない

        '
    - id: weekly_world_trivia_1493246078357606430
      enabled: true
      channel_id: 1493246078357606430
      weekday: 日曜
      time: '12:00'
      timezone: Asia/Tokyo
      model: gemini-2.5-flash
      today_language:
        enabled: true
        reactions:
          enabled: true
          unknown_emoji: ✋
          known_emoji: 👀
          learned_emoji: ✅
          issue_emoji: ⚠️
      prompt: 'Discordの管理チャンネルに投稿する短い海外の豆知識を1つ作ってください。

        条件:

        - 日本語で2〜4文

        - 毎回ランダムに世界のエリアを1つ選ぶ

        - エリア例: アジア、ヨーロッパ、北米、南米、アフリカ、中東、オセアニア、北欧、東南アジア、中央アジア

        - 選んだエリアの文化、地理、歴史、生活習慣のどれかに関する意外な豆知識

        - 最初に「【海外豆知識】~○○編~」と付ける

        - 誤情報を避け、断定しすぎない

        '
